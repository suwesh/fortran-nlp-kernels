name: Build Linux Wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build CPython wheels
    runs-on: ubuntu-24.04

    env:
      CIBW_BUILD: "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64"
      CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
      CIBW_BUILD_VERBOSITY: "1"

      CIBW_BEFORE_ALL_LINUX: >
        dnf install -y
        gcc-gfortran
        gcc-c++
        openblas-devel

      CIBW_ENVIRONMENT_LINUX: >
        OMP_NUM_THREADS=4
        OPENBLAS_NUM_THREADS=1

      CIBW_TEST_REQUIRES: "pytest>=8 numpy>=2.0"

      CIBW_TEST_COMMAND: >
        python -m pytest {project}/tests -v

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade \
            pip \
            cibuildwheel==4.3.1

      - name: Build and test wheels
        run: |
          python -m cibuildwheel \
            --platform linux \
            --output-dir wheelhouse

      - name: List generated wheels
        run: |
          ls -lh wheelhouse/

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error