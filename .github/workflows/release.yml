name: publish cuda companion

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
  publish-cuda:
    name: Publish CUDA companion to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi-cuda
      url: https://pypi.org/project/fortran-nlp-kernels-cuda/0.1.2/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download CUDA wheel from github release
        shell: bash
        env:
            GH_TOKEN: ${{ github.token }}
        run: |
            set -euo pipefail
            mkdir -p dist
            gh release download v0.1.1 --repo "$GITHUB_REPOSITORY" --pattern 'fortran_nlp_kernels_cuda-0.1.2-cp312-cp312-manylinux_2_34_x86_64.whl' --dir dist
            ls -lh dist/
      - name: Publish CUDA companion
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/