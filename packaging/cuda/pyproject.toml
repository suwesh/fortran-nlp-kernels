[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python>=0.18",
    "nanobind>=3.1",
    "numpy>=2.0",
]

[project]
name = "fortran-nlp-kernels-cuda"
version = "0.1.2"
description = "CUDA Fortran and cuBLAS companion for fortran-nlp-kernels with external NVIDIA runtime dependencies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Suwesh Prasad Sah", email = "83471963+suwesh@users.noreply.github.com" },
]

dependencies = [
    "fortran-nlp-kernels==0.1.1",
]

[project.urls]
Homepage = "https://suwesh.github.io/"
Repository = "https://github.com/suwesh/fortran-nlp-kernels"
Issues = "https://github.com/suwesh/fortran-nlp-kernels/issues"